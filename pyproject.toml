[project]
name = "preserve"
version = "0.1.0"
description = "Transcribe a scanned PDF into per-page Markdown with LaTeX math and tables."
requires-python = ">=3.11"
dependencies = [
    "docling",
    "pymupdf",
    "pyyaml",
]

[project.scripts]
preserve = "preserve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/preserve"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
